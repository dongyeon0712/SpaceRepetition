<title>MHCID Recall</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --purple:#4b2e83; --purple-ink:#3a2266; --purple-soft:#efe9f8;
    --gold:#ffdc2e; --gold-ink:#7a5c00;
    --paper:#faf8fc; --surface:#ffffff; --surface-2:#f1ecf9;
    --ink:#241c33; --ink-dim:#6d6379; --line:#e3daf0;
    --success:#2f8f5b; --success-soft:#e4f5ec;
    --warning:#a9660a; --warning-soft:#fbedd9;
    --danger:#c0392b; --danger-soft:#fbe4e1;
    --info:#3b6fa0; --info-soft:#e4eef6;
    --shadow: 0 10px 30px -12px rgba(75,46,131,0.35);
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  body{background:var(--paper); color:var(--ink); font-family:"Open Sans",system-ui,sans-serif;}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  .app{
    max-width:900px; margin:0 auto; width:100%; background:var(--paper);
    position:relative; overflow-x:hidden;
  }
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
    background:var(--purple); color:#fff; padding:22px 20px 26px;
    border-radius:0 0 20px 20px; box-shadow:var(--shadow);
    overflow:hidden;
  }
  .brand-row{position:relative; display:flex; align-items:center; gap:8px; margin:0 0 4px;}
  .brand-mark{flex-shrink:0; display:block;}
  .eyebrow{
    font-size:clamp(13px,3.4vw,16px); font-weight:800; letter-spacing:2px;
    text-transform:uppercase; color:var(--gold); margin:0;
  }
  .h1{position:relative; font-size:clamp(32px,8vw,42px); font-weight:800; margin:2px 0 0; letter-spacing:-.2px;}
  .sub{position:relative; font-size:clamp(15px,4vw,18px); color:rgba(255,255,255,.78); margin:6px 0 0;}
  main{padding:18px 16px calc(100px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:20px;}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:16px; display:flex; flex-direction:column; gap:8px;
  }
  .hero-stat{
    background:linear-gradient(155deg, #efe9f8, #ddccf2);
    color:var(--purple-ink); border-radius:20px; padding:24px; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:space-between; gap:14px;
  }
  .hero-stat .num{font-size:clamp(48px,13vw,64px); font-weight:800; line-height:1;}
  .hero-stat .label{font-size:clamp(15px,4vw,18px); color:rgba(58,34,102,.7); margin-top:4px;}
  .btn{
    appearance:none; border:none; border-radius:14px; font:inherit; font-weight:700;
    cursor:pointer; padding:clamp(14px,3.6vw,18px) clamp(20px,5vw,26px); font-size:clamp(16px,4.2vw,19px); display:inline-flex;
    align-items:center; justify-content:center; gap:8px; transition:transform .08s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-gold{background:var(--gold); color:var(--gold-ink);}
  .btn-purple{background:var(--purple); color:#fff;}
  .btn-outline{background:transparent; border:1.5px solid rgba(255,255,255,.55); color:#fff;}
  .btn-ghost{background:var(--surface-2); color:var(--ink);}
  .btn-block{width:100%;}
  .btn:disabled{opacity:.5; cursor:default;}
  h2.section-title{font-size:clamp(17px,4.4vw,21px); font-weight:800; margin:0; color:var(--ink); display:flex; align-items:center; gap:8px;}
  .deck-row{
    display:flex; align-items:center; gap:14px; padding:16px; border-radius:16px;
    border:1px solid var(--line); background:var(--surface); cursor:pointer;
  }
  .deck-swatch{width:clamp(40px,10vw,52px); height:clamp(40px,10vw,52px); border-radius:10px; background:var(--purple-soft); color:var(--purple);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .deck-info{flex:1; min-width:0;}
  .deck-info .t{font-weight:700; font-size:clamp(16px,4.2vw,19px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .deck-info .d{font-size:clamp(14px,3.6vw,16px); color:var(--ink-dim);}
  .chip{
    font-size:clamp(13px,3.4vw,15px); font-weight:700; padding:5px 12px; border-radius:999px; white-space:nowrap;
  }
  .chip-due{background:var(--gold); color:var(--gold-ink);}
  .chip-done{background:var(--success-soft); color:var(--success);}
  .empty{
    text-align:center; padding:36px 16px; color:var(--ink-dim); display:flex; flex-direction:column; gap:10px; align-items:center;
  }
  .empty svg{opacity:.55;}

  /* review */
  .progress-row{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-dim);}
  .progress-bar{flex:1; height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden;}
  .progress-bar > i{display:block; height:100%; background:var(--purple); border-radius:999px; transition:width .25s ease;}
  .flip-card{
    position:relative; flex:0 0 auto; min-height:300px; max-height:60vh; border-radius:22px; background:var(--surface);
    border:1px solid var(--line); box-shadow:var(--shadow); padding:26px 22px;
    display:flex; flex-direction:column; cursor:pointer; overflow:hidden;
  }
  .flip-card::after{
    content:""; position:absolute; right:-18px; bottom:-18px; width:110px; height:110px; opacity:.07;
    background:
      linear-gradient(var(--purple),var(--purple)) 0 24px/100% 4px no-repeat,
      linear-gradient(var(--purple),var(--purple)) 0 44px/70% 4px no-repeat,
      linear-gradient(var(--purple),var(--purple)) 0 64px/85% 4px no-repeat;
    transform:rotate(-14deg);
  }
  .face-label{font-size:clamp(13px,3.4vw,15px); font-weight:800; letter-spacing:1.6px; text-transform:uppercase; color:var(--purple);}
  .face-text{flex:1; display:flex; align-items:center; font-size:clamp(22px,5.6vw,28px); font-weight:700; line-height:1.4; text-wrap:balance; margin-top:10px;}
  .flip-hint{font-size:clamp(14px,3.6vw,16px); color:var(--ink-dim); text-align:center;}
  .grade-row{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .grade-btn{
    border-radius:12px; padding:12px 4px; text-align:center; border:1.5px solid var(--line);
    background:var(--surface); cursor:pointer; display:flex; flex-direction:column; gap:2px;
  }
  .grade-btn b{font-size:clamp(15px,3.8vw,17px);}
  .grade-btn span{font-size:clamp(12px,3.1vw,13px); color:var(--ink-dim);}
  .grade-again{border-color:var(--danger); color:var(--danger);}
  .grade-hard{border-color:var(--warning); color:var(--warning);}
  .grade-good{border-color:var(--info); color:var(--info);}
  .grade-easy{border-color:var(--success); color:var(--success);}
  .grade-btn:active{transform:scale(.96);}

  /* browse */
  .search{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:9px 12px;
  }
  .search input{border:none; outline:none; background:transparent; font:inherit; color:var(--ink); flex:1;}
  .browse-card{border:1px solid var(--line); border-radius:14px; background:var(--surface); overflow:hidden;}
  .browse-card .front{padding:16px; font-weight:700; font-size:clamp(16px,4.2vw,18px); display:flex; gap:10px; align-items:flex-start; cursor:pointer;}
  .browse-card .front .qmark{color:var(--purple); flex-shrink:0;}
  .browse-card .back{padding:0 16px 16px 42px; font-size:clamp(15px,3.9vw,17px); color:var(--ink-dim); display:none;}
  .browse-card.open .back{display:block;}
  .browse-card .meta{display:flex; gap:12px; padding:0 14px 12px 38px; font-size:11px; color:var(--ink-dim);}
  .browse-card .meta b{color:var(--ink);}
  .icon-btn{background:none; border:none; color:var(--ink-dim); cursor:pointer; padding:4px;}
  .icon-btn.danger{color:var(--danger);}
  .row-between{display:flex; align-items:center; justify-content:space-between; gap:8px;}

  /* add */
  textarea{
    width:100%; min-height:120px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--ink); font:inherit; padding:12px; resize:vertical;
  }
  input[type=text]{
    width:100%; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    font:inherit; padding:10px 12px;
  }
  .dropzone{
    border:1.5px dashed var(--line); border-radius:14px; padding:22px 14px; text-align:center; color:var(--ink-dim);
    display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; background:var(--surface-2);
  }
  .dropzone input{display:none;}
  .file-pill{display:inline-flex; align-items:center; gap:6px; background:var(--purple-soft); color:var(--purple);
    font-size:12.5px; font-weight:700; padding:6px 10px; border-radius:999px;}
  .status-line{font-size:clamp(14px,3.6vw,15px); color:var(--ink-dim); display:flex; align-items:center; gap:8px;}
  .spinner{width:14px; height:14px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--purple); animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .preview-list{display:flex; flex-direction:column; gap:8px; max-height:260px; overflow-y:auto;}
  .preview-item{border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:clamp(15px,3.9vw,16px);}
  .preview-item .q{font-weight:700;}
  .preview-item .a{color:var(--ink-dim); margin-top:2px;}
  .banner{border-radius:12px; padding:12px 14px; font-size:clamp(14px,3.6vw,15px); display:flex; gap:8px; align-items:flex-start;}
  .banner-danger{background:var(--danger-soft); color:var(--danger);}
  .banner-info{background:var(--info-soft); color:var(--info);}

  /* tab bar */
  nav.tabbar{
    position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:900px;
    z-index:5; display:flex; background:var(--surface);
    border-top:1px solid var(--line); padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
  }
  nav.tabbar button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--ink-dim); font:inherit; font-size:clamp(12px,3.2vw,14px); font-weight:700; padding:9px 2px; cursor:pointer; border-radius:10px;
  }
  nav.tabbar button svg{width:clamp(24px,6vw,28px); height:clamp(24px,6vw,28px);}
  nav.tabbar button.active{color:var(--purple);}
  nav.tabbar button.active svg{stroke:var(--purple);}
  [hidden]{display:none!important;}
  a{color:var(--purple);}
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand-row">
      <svg class="brand-mark" width="22" height="22" viewBox="0 0 96 72" role="img" aria-hidden="true">
        <rect x="4" y="16" width="60" height="42" rx="8" fill="#cbb8ea"/>
        <rect x="14" y="6" width="60" height="42" rx="8" fill="#ffdc2e"/>
        <rect x="24" y="20" width="40" height="6" rx="3" fill="#4b2e83"/>
        <rect x="24" y="31" width="26" height="6" rx="3" fill="#4b2e83"/>
      </svg>
      <p class="eyebrow">MHCI+D</p>
    </div>
    <h1 class="h1" id="topbarTitle">Recall</h1>
    <p class="sub" id="topbarSub">Spaced-repetition review, built from your notes</p>
  </header>

  <main id="main"></main>

  <nav class="tabbar">
    <button data-tab="home" class="tab-btn active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      Home
    </button>
    <button data-tab="review" class="tab-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h11l5 5v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z"/><path d="M15 6v5h5"/></svg>
      Review
    </button>
    <button data-tab="browse" class="tab-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
      Browse
    </button>
    <button data-tab="add" class="tab-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      Add
    </button>
  </nav>
</div>

<script>
(function(){
  "use strict";

  // ---------- seed content, generated from the uploaded class notes ----------
  var SEED_DECK = {
    title: "Circuit Fundamentals",
    description: "Introductory Lesson on Common Circuit Components",
    cards: [
      {front:"What is the base unit of voltage, and how is a generic power source usually drawn?", back:"The volt (V). A generic source is drawn as a circle containing plus and minus signs with an associated voltage value."},
      {front:"How is a physical battery drawn on a schematic?", back:"As alternating long and short parallel lines  -  the long line marks the positive terminal, the short line the negative terminal."},
      {front:"Which direction do electrons actually flow from a battery, and which direction does conventional current use instead?", back:"Electrons emerge from the negative terminal, but circuit calculations model conventional current as flowing from the positive terminal."},
      {front:"What circuit symbol is a zigzag line, and what does that component do?", back:"A resistor  -  it limits and controls the amount of current flowing through a branch of a circuit."},
      {front:"What is the base unit of resistance, and how are resistor values usually marked on the part?", back:"The ohm (Ω). Because resistors are too small for printed numbers, colored bands around the body encode the value instead."},
      {front:"What is a capacitor physically made of, and what does it store?", back:"Two closely spaced conductive plates separated by a dielectric (air or an insulator like plastic), storing energy in an electric field between them."},

      {front:"What everyday device charges a capacitor slowly and discharges it instantly, and why?", back:"A point-and-shoot camera flash  -  it accumulates charge from the battery over several seconds, then releases it instantly to ionize gas in the flash bulb."},
      {front:"Why are capacitors and inductors called duals, and where does this show up in everyday use?", back:"They exchange energy back and forth in resonant circuits. Tuning an analog radio dial adjusts capacitance to match the frequency exchanged with an inductor."},
      {front:"What is an inductor, and what form does its stored energy take?", back:"A coil of insulated wire that concentrates the magnetic field created by current flowing through it, storing energy in that magnetic field."},
      {front:"What is the base unit of inductance, and what two things change an inductor's value?", back:"The henry (H). Inductance rises with more coil turns, and can also be changed by inserting a core material (like metal) inside the coil."},
      {front:"What everyday machine mirrors inductor behavior by turning motion into current?", back:"A power-plant turbine generator  -  rotating coils and magnets create electric current from a changing magnetic field."},
      {front:"What does a diode do, and how is it drawn on a schematic?", back:"It lets current flow forward with little resistance but blocks it in reverse; drawn as a triangle pointing toward a perpendicular line (the cathode)."},
      {front:"What happens if a diode is subjected to too much reverse voltage?", back:"It is overpowered by the reverse voltage, causing thermal destruction  -  it can fail and smoke."},
      {front:"How can you identify which way current is allowed to flow through a physical diode?", back:"A printed band near one end marks the cathode, showing the allowed current direction."},
      {front:"How does an LED differ from a standard diode, and how is that shown on a schematic?", back:"An LED uses an internal silicon structure to emit light when forward-biased. It is drawn as the diode triangle with small outward squiggly lines representing emitted light."},
      {front:"What two core jobs can a transistor perform, and how many terminals does it use?", back:"It can act as a solid-state switch or a linear signal amplifier, using three terminals  -  one lead controls current through the other two."},
      {front:"What does a transformer do, and how does it physically work?", back:"It steps AC voltage up or down (e.g. 120V wall power to 10V) using magnetic induction between insulated coil windings wound on a shared iron core."},
      {front:"Where in the power grid do transformers step voltage down for homes?", back:"Utility transformers mounted on utility poles reduce high-voltage transmission-line power down to the level used at residential wall sockets."},
      {front:"What topic does this lesson set up for the next module?", back:"Circuit analysis laws and resistor-source network calculations."}
    ]
  };

  var SEED_DECK_2 = {
    title: "Technology and the Virtues - Intro",
    description: "Spaced-repetition notes on Shannon Vallor's introduction",
    cards: [
      {front:"What are technomoral virtues?", back:"Moral character traits, cultivated individually and collectively, that help humans live well with emerging technologies."},
      {front:"What does \"technosocial\" mean?", back:"Technology and society as one intertwined system that evolves together; what matters is how technologies become embedded in social practices, values, and institutions."},
      {front:"What is acute technosocial opacity?", back:"Our growing inability to see where our technosocial future is heading, which makes it hard to identify and pursue a good life."},
      {front:"What is the \"good life\" in ethics?", back:"The kind of life most worthy of choosing for a human being; the ultimate goal of ethics."},
      {front:"How does Vallor broadly define ethics?", back:"Reflective inquiry into the good life."},
      {front:"What does it mean that technologies \"afford\" actions?", back:"They open up some possibilities for action and close off others."},
      {front:"Example of affordance in the introduction?", back:"The bow and arrow made it possible to kill from a safe distance, whether an animal or a rival."},
      {front:"Why are 21st-century choices \"technomoral\" rather than just moral?", back:"They depend on the changing affordances of the technological systems that support and shape our lives."},

      {front:"What is the harder challenge than predicting new technologies?", back:"Figuring out what we will do with technologies, and what they will do with us."},

      {front:"Why do ethical ideals need a foreseeable future?", back:"Ideals only motivate us when we can imagine how following them today makes tomorrow's life better."},
      {front:"Why could classical thinkers give lasting moral guidance?", back:"They could assume life conditions would stay relatively stable, so their children would face similar moral challenges."},
      {front:"Name the five classical ethical founders Vallor lists.", back:"Plato, Aristotle, Aquinas, Confucius, the Buddha."},
      {front:"Is technosocial opacity an old or new problem for ethics?", back:"Relatively new."},
      {front:"What is Kant's categorical imperative?", back:"Act only on principles you could will to be universal rules for everyone in similar situations."},

      {front:"Three future scenarios Vallor uses against Kant?", back:"Pervasive surveillance, living with social robots, and biomedical enhancement of bodies and minds."},
      {front:"What happens to the Kantian agent facing technosocial uncertainty?", back:"The uncertainties overwhelm her reasoning and paralyze rational, consistent choice."},
      {front:"What does utilitarianism ask?", back:"Choose the action that produces the greatest happiness for all affected."},
      {front:"Why does utilitarianism struggle today?", back:"Technological outcomes are too uncertain and numerous to assign reliable probabilities."},

      {front:"Which Bradbury story does Vallor discuss in detail?", back:"\"The Veldt\" (1950)."},
      {front:"What happens in \"The Veldt\"?", back:"A family's total reliance on their automated \"Happy-life Home\" strips their lives of work, joy, purpose, and family love."},
      {front:"What irony does Vallor see in Lydia Hadley's complaint?", back:"Lydia felt she had too much free time; today's tech users have the opposite problem: overstimulation and no leisure."},
      {front:"Why are Bradbury's stories ethical, according to Vallor?", back:"He imagined how ordinary people like himself would fare, living well or failing to live well, in a near technological future."},
      {front:"What role do Bradbury's Martians play?", back:"Literary foils that reflect human strengths, obsessions, and weaknesses."},
      {front:"What objection does Vallor anticipate?", back:"Academics who dismiss claims of radical change by pointing to similar alarms raised in the past."},
      {front:"Her joke label for the skeptics' toolkit?", back:"\"Break Glass in Case of Moral Panic.\""},
      {front:"Why does she think this era really is different?", back:"Unprecedented global economic and physical interdependence, and unprecedented spread of information, norms, ideas, and values."},

      {front:"Nicholas Carr's book and argument?", back:"The Shallows: digital habits may harm our brains cognitively and morally."},
      {front:"Evgeny Morozov's critique?", back:"The Net Delusion and To Save Everything, Click Here: against blind faith in technological \"solutionism.\""},
      {front:"Jaron Lanier's book and argument?", back:"You Are Not a Gadget: criticizes Silicon Valley's libertarian, anti-humanist values (unrestrained capitalism, consumerism, reductive efficiency)."},
      {front:"What value does the book share with these critics?", back:"A humanistic view that the good life is lived by and with people of ethical character."},
      {front:"Can the good life be achieved alone?", back:"No. Only through care, cooperation, and support from others, and willingness to give the same."},
      {front:"Which philosophies is the book inconsistent with?", back:"Antihumanistic and neoliberal philosophies."},
      {front:"Is Vallor anti-technology?", back:"No. She hopes for human flourishing with technology and argues that being anti-technology is in some sense being anti-human."},
      {front:"What are the \"only meaningful questions\" about technology?", back:"Which technologies to create, with what knowledge and design, affording what, shared with whom, for whose benefit, and for what greater ends."}
    ]
  };

  var EASE_DEFAULT = 2.5, EASE_MIN = 1.3, EASE_MAX = 2.8;

  function nowIso(){ return new Date().toISOString(); }
  function daysFromNow(n){ return new Date(Date.now() + n*86400000).toISOString(); }
  function freshCard(c){
    return {front:c.front, back:c.back, ease:EASE_DEFAULT, interval:0, reps:0, due: nowIso(), createdAt: nowIso()};
  }
  function grade(card, g){
    var ease = card.ease, interval = card.interval, reps = card.reps;
    if (g === "again"){ reps = 0; interval = 0; ease = Math.max(EASE_MIN, ease - 0.2); }
    else if (g === "hard"){ interval = Math.max(1, Math.round(interval * 1.2)); ease = Math.max(EASE_MIN, ease - 0.15); }
    else if (g === "good"){ reps += 1; interval = reps === 1 ? 1 : (reps === 2 ? 3 : Math.round(interval * ease)); }
    else if (g === "easy"){ reps += 1; ease = Math.min(EASE_MAX, ease + 0.15); interval = reps === 1 ? 3 : Math.round(interval * ease * 1.3) + 1; }
    return { ease: ease, interval: interval, reps: reps, due: daysFromNow(interval), lastReviewed: nowIso() };
  }
  function fmtDue(iso){
    var diff = new Date(iso).getTime() - Date.now();
    if (diff <= 0) return "due now";
    var days = Math.round(diff / 86400000);
    if (days <= 0) return "due today";
    if (days === 1) return "due tomorrow";
    return "due in " + days + "d";
  }
  function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }

  // ---------- storage backend: real db capability, or localStorage fallback ----------
  var LOCAL_KEY = "mhcid-recall-v1";
  function localRead(){
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "null") || {decks:[]}; }
    catch(e){ return {decks:[]}; }
  }
  function localWrite(data){
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); } catch(e){}
  }
  function uid(){ return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

  var Store = {
    db: null,
    mode: "local", // "db" | "local"

    async init(){
      try {
        if (window.claude && window.claude.use) {
          this.db = await window.claude.use("db");
        }
      } catch(e){ this.db = null; }
      this.mode = this.db ? "db" : "local";
    },

    async listDecks(){
      if (this.mode === "db") {
        var snap = await this.db.collection("decks").orderBy("createdAt", "asc").get();
        var decks = [];
        for (var i = 0; i < snap.docs.length; i++){
          var d = snap.docs[i];
          var cardsSnap = await this.db.doc("decks/" + d.id).collection("cards").get();
          var cards = cardsSnap.docs.map(function(cd){ return Object.assign({id: cd.id}, cd.data()); });
          decks.push(Object.assign({id: d.id}, d.data(), {cards: cards}));
        }
        return decks;
      }
      var data = localRead();
      return data.decks;
    },

    async seedIfEmpty(){
      var decks = await this.listDecks();
      var titles = decks.map(function(d){ return d.title; });
      var defaults = [SEED_DECK, SEED_DECK_2];
      var addedAny = false;
      for (var i = 0; i < defaults.length; i++){
        if (titles.indexOf(defaults[i].title) === -1){
          await this.addDeck(defaults[i].title, defaults[i].description, defaults[i].cards);
          addedAny = true;
        }
      }
      return addedAny ? this.listDecks() : decks;
    },

    async addDeck(title, description, rawCards){
      var cards = rawCards.map(freshCard);
      if (this.mode === "db") {
        var ref = await this.db.collection("decks").add({title: title, description: description || "", createdAt: nowIso()});
        for (var i = 0; i < cards.length; i++){
          await ref.collection("cards").add(cards[i]);
        }
        return ref.id;
      }
      var data = localRead();
      var id = uid();
      cards.forEach(function(c){ c.id = uid(); });
      data.decks.push({id: id, title: title, description: description || "", createdAt: nowIso(), cards: cards});
      localWrite(data);
      return id;
    },

    async updateCard(deckId, cardId, patch){
      if (this.mode === "db") {
        await this.db.doc("decks/" + deckId).collection("cards").doc(cardId).update(patch);
        return;
      }
      var data = localRead();
      var deck = data.decks.find(function(d){ return d.id === deckId; });
      if (!deck) return;
      var card = deck.cards.find(function(c){ return c.id === cardId; });
      if (!card) return;
      Object.assign(card, patch);
      localWrite(data);
    },

    async deleteCard(deckId, cardId){
      if (this.mode === "db") {
        await this.db.doc("decks/" + deckId).collection("cards").doc(cardId).delete();
        return;
      }
      var data = localRead();
      var deck = data.decks.find(function(d){ return d.id === deckId; });
      if (!deck) return;
      deck.cards = deck.cards.filter(function(c){ return c.id !== cardId; });
      localWrite(data);
    },

    async deleteDeck(deckId){
      if (this.mode === "db") {
        var col = this.db.doc("decks/" + deckId).collection("cards");
        var snap = await col.get();
        for (var i = 0; i < snap.docs.length; i++){
          await col.doc(snap.docs[i].id).delete();
        }
        await this.db.doc("decks/" + deckId).delete();
        return;
      }
      var data = localRead();
      data.decks = data.decks.filter(function(d){ return d.id !== deckId; });
      localWrite(data);
    }
  };

  // ---------- app state ----------
  var state = { tab: "home", decks: [], reviewDeckId: null, reviewQueue: [], reviewIndex: 0, flipped: false, openCardId: null, search: "" };

  function dueCards(deck){
    var t = Date.now();
    return deck.cards.filter(function(c){ return new Date(c.due).getTime() <= t; });
  }
  function totalDue(){
    return state.decks.reduce(function(sum, d){ return sum + dueCards(d).length; }, 0);
  }
  function totalCards(){
    return state.decks.reduce(function(sum, d){ return sum + d.cards.length; }, 0);
  }

  async function refresh(){

  function deckGlyph(){
    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>';

  function emptyState(title, sub){
    return '<div class="empty">' +
      '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M7 2v4M17 2v4M3 11h18"/></svg>' +

  function beginReview(deckId){
    var pool = deckId ? state.decks.filter(function(d){ return d.id === deckId; }) : state.decks;
    var queue = [];
    pool.forEach(function(d){
      dueCards(d).forEach(function(c){ queue.push({deckId: d.id, card: c}); });
    });
    // shuffle
    for (var i = queue.length - 1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t=queue[i]; queue[i]=queue[j]; queue[j]=t; }
    state.reviewQueue = queue;
    state.reviewSessionTotal = queue.length;
    state.reviewDone = 0;
    state.flipped = false;
    state.tab = "review";
    render();
  }

  function renderReview(){
    topbarTitle.textContent = "Review";
    topbarSub.textContent = "Tap the card to reveal the answer";
    if (!state.reviewQueue || !state.reviewQueue.length){
      main.innerHTML = emptyState("All caught up", "No cards are due right now. Great work  -  check back later or browse your decks.");
      return;
    }
    var item = state.reviewQueue[0];
    var remaining = state.reviewQueue.length;
    var pct = state.reviewSessionTotal ? Math.round(100 * state.reviewDone / state.reviewSessionTotal) : 0;
    var html = '';
    html += '<div class="progress-row"><span class="mono">' + state.reviewDone + '/' + state.reviewSessionTotal + '</span><div class="progress-bar"><i style="width:' + pct + '%"></i></div></div>';

      '<div class="face-label">' + (state.flipped ? 'Answer' : 'Question') + '</div>' +
      '<div class="face-text">' + esc(state.flipped ? item.card.back : item.card.front) + '</div>' +
      '<div class="flip-hint">' + (state.flipped ? '' : 'Tap to reveal') + '</div>' +
      '</div>';
    if (state.flipped){
      html += '<div class="grade-row">' +
        '<div class="grade-btn grade-again" data-g="again"><b>Again</b><span>&lt;1d</span></div>' +
        '<div class="grade-btn grade-hard" data-g="hard"><b>Hard</b><span>' + Math.max(1, Math.round(item.card.interval*1.2)) + 'd</span></div>' +
        '<div class="grade-btn grade-good" data-g="good"><b>Good</b><span>' + (item.card.reps===0?1:(item.card.reps===1?3:Math.round(item.card.interval*item.card.ease))) + 'd</span></div>' +
        '<div class="grade-btn grade-easy" data-g="easy"><b>Easy</b><span>' + (item.card.reps===0?3:Math.round(item.card.interval*item.card.ease*1.3)+1) + 'd</span></div>' +
        '</div>';
    }
    main.innerHTML = html;
    document.getElementById("flipCard").onclick = function(){
      state.flipped = !state.flipped;
      render();
    };
    if (state.flipped){
      main.querySelectorAll(".grade-btn").forEach(function(btn){
        btn.onclick = function(ev){
          ev.stopPropagation();
          applyGrade(btn.dataset.g);
        };
      });
    }
  }

  async function applyGrade(g){
    var item = state.reviewQueue.shift();
    var patch = grade(item.card, g);
    Object.assign(item.card, patch);
    try { await Store.updateCard(item.deckId, item.card.id, patch); } catch(e){}
    if (g === "again"){ state.reviewQueue.push(item); }
    else { state.reviewDone += 1; }
    state.flipped = false;
    render();
  }

  function extractJson(text){
    try { return JSON.parse(text); } catch(e){}
    var fence = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fence){ try { return JSON.parse(fence[1]); } catch(e){} }
    var start = text.search(/[\{\[]/);
    var end = Math.max(text.lastIndexOf("}"), text.lastIndexOf("]"));
    if (start >= 0 && end > start){
      try { return JSON.parse(text.slice(start, end + 1)); } catch(e){}
    }
    return null;
  }

  async function callAnthropicDirect(apiKey, prompt){
    var res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-haiku-4-5-20251001",
        max_tokens: 3000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    var body = await res.json().catch(function(){ return null; });
    if (!res.ok){
      var msg = (body && body.error && body.error.message) || ("Request failed (" + res.status + ")");
      var err = new Error(msg);
      err.status = res.status;
      throw err;
    }
    var text = (body && body.content && body.content[0] && body.content[0].text) || "";
    if (!text) throw new Error("Empty response");
    return text;
  }

        '<button class="btn btn-gold btn-block" id="saveDeckBtn">Save deck</button>' +
        '</div>';
    }

    if (Capabilities.checked && !Capabilities.sample){
      html += '<div class="banner banner-info">Automatic generation is included free with your Claude subscription. Open this app from inside the Claude app or claude.ai (not a bare link) and Generate cards works with no setup.</div>';
      html += apiKeySettingsHtml();
      html += manualFormHtml();
    }

    main.innerHTML = html;
    wireAddTab();
  }

  function apiKeySettingsHtml(){
    var key = getApiKey();
    return '<div class="card">' +
      '<h2 class="section-title">Advanced: use your own API key instead</h2>' +
      '<div style="font-size:14px;color:var(--ink-dim);">Optional, and not free — Anthropic’s API is billed separately from your Claude subscription and requires adding your own payment method at console.anthropic.com. Only set this up if you specifically want generation to work without ever opening the Claude app. The key is stored only in this browser and is never sent anywhere except api.anthropic.com.</div>' +
      '<input id="apiKeyInput" type="password" placeholder="' + (key ? "Key saved, ending " + esc(key.slice(-4)) : "sk-ant-...") + '">' +
      '<div style="display:flex;gap:8px;">' +
        '<button class="btn btn-ghost" id="saveKeyBtn">Save key</button>' +
        (key ? '<button class="btn btn-ghost" id="removeKeyBtn">Remove key</button>' : '') +
      '</div>' +
      '<div class="banner banner-info">This only works when this page is self-hosted or opened as a local file. The claude.ai link blocks outside network calls for security, so a saved key will not work there.</div>' +
      '</div>';
  }

  function manualFormHtml(){
    return '<div class="card" id="manualCard">' +
      '<h2 class="section-title">Add a card manually</h2>' +
      '<input id="manualFront" type="text" placeholder="Question">' +
      '<input id="manualBack" type="text" placeholder="Answer">' +
      '<button class="btn btn-ghost btn-block" id="manualAddBtn">Add card to a new deck</button>' +
      '</div>';
  }

  function wireAddTab(){
    var fileInput = document.getElementById("fileInput");
    var notesText = document.getElementById("notesText");
    var deckTitle = document.getElementById("deckTitle");
    var genBtn = document.getElementById("genBtn");
    if (notesText) notesText.oninput = function(){ addState.text = notesText.value; };
    if (deckTitle) deckTitle.oninput = function(){ addState.title = deckTitle.value; };
    if (fileInput) fileInput.onchange = function(){ handleFile(fileInput.files[0]); };
    if (genBtn) genBtn.onclick = generateCards;
    var saveBtn = document.getElementById("saveDeckBtn");
    if (saveBtn) saveBtn.onclick = saveGeneratedDeck;
    var manualBtn = document.getElementById("manualAddBtn");
    if (manualBtn) manualBtn.onclick = addManualCard;
    var saveKeyBtn = document.getElementById("saveKeyBtn");
    if (saveKeyBtn) saveKeyBtn.onclick = function(){
      var val = document.getElementById("apiKeyInput").value.trim();
      if (val) setApiKey(val);
      render();
    };
    var removeKeyBtn = document.getElementById("removeKeyBtn");
    if (removeKeyBtn) removeKeyBtn.onclick = function(){ setApiKey(""); render(); };
  }

  async function addManualCard(){
    var f = document.getElementById("manualFront").value.trim();
    var b = document.getElementById("manualBack").value.trim();
    if (!f || !b) return;
    await Store.addDeck(addState.title || "My notes", "Added manually", [{front:f, back:b}]);
    addState = { text:"", fileName:"", title:"", status:"idle", error:"", generated:null };
    await refresh();
    state.tab = "home";
    render();
  }

  async function handleFile(file){
    if (!file) return;
    addState.fileName = file.name;
    addState.error = "";
    render();
    try {
      if (/\.(txt|md)$/i.test(file.name)){
        addState.text = await file.text();
        render();
        return;
      }
      var text = await extractPdfText(file);
      if (!text || !text.trim()){
        addState.error = "Couldn't find readable text in that PDF. Try pasting the notes instead.";
      } else {
        addState.text = text;
      }
    } catch(e){
      addState.error = "Couldn't read that PDF in this view. Paste the notes text below instead.";
    }
    render();
  }

  var pdfLibPromise = null;
  function loadPdfLib(){
    if (pdfLibPromise) return pdfLibPromise;
    pdfLibPromise = new Promise(function(resolve, reject){
      var s1 = document.createElement("script");
      s1.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js";
      s1.onload = function(){
        var s2 = document.createElement("script");
        s2.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
        s2.onload = function(){ resolve(window["pdfjs-dist/build/pdf"] || window.pdfjsLib); };
        s2.onerror = reject;
        document.head.appendChild(s2);
      };
      s1.onerror = reject;
      document.head.appendChild(s1);
    });
    return pdfLibPromise;
  }

  async function extractPdfText(file){
    var pdfjsLib = await loadPdfLib();
    if (!pdfjsLib) throw new Error("pdf.js unavailable");
    try {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    } catch(e){}
    var buf = await file.arrayBuffer();
    var doc = await pdfjsLib.getDocument({ data: buf }).promise;
    var text = "";
    var pages = Math.min(doc.numPages, 30);
    for (var i = 1; i <= pages; i++){
      var page = await doc.getPage(i);
      var content = await page.getTextContent();
      text += content.items.map(function(it){ return it.str; }).join(" ") + "\n\n";
    }
    return text;
  }

  function buildCardPrompt(text){
    return "You are helping a student turn class notes into spaced-repetition flashcards.\n" +
      "Read the notes below and reply with ONLY a JSON object of this exact shape:\n" +
      '{"title": "short deck name", "cards": [{"front": "question", "back": "answer"}, ...]}\n' +
      "Write 10 to 18 atomic flashcards, each testing exactly one idea, phrased as a clear question and a concise answer in plain text (no markdown, no LaTeX). " +
      "Cover the most important concepts and skip filler or timestamps.\n\nNOTES:\n" + text.slice(0, 9000);
  }

  function applyGeneratedCards(data){
    if (!data || !Array.isArray(data.cards) || !data.cards.length) return false;
    addState.generated = { title: data.title || "New deck", cards: data.cards.filter(function(c){ return c && c.front && c.back; }) };
    if (!addState.generated.cards.length) return false;
    if (!addState.title) addState.title = addState.generated.title;
    return true;
  }

  async function generateCards(){
    var text = (document.getElementById("notesText") || {}).value || addState.text;
    addState.text = text;
    if (!text || !text.trim()){
      addState.error = "Add some notes first  -  upload a file or paste text above.";
      render();
      return;
    }
    addState.error = "";
    var prompt = buildCardPrompt(text);

    if (Capabilities.sample){
      addState.status = "generating";
      render();
      try {
        var data = await Capabilities.sample.json(prompt, { modelTier: "default", cache: false });
        if (!applyGeneratedCards(data)) throw { code: "empty_completion" };
        addState.status = "idle";
      } catch(e){
        addState.status = "idle";
        var code = e && e.code;
        if (code === "not_granted") addState.error = "Card generation needs your permission  -  try the Generate button again to allow it.";
        else if (code === "rate_limited") addState.error = "Too many requests right now  -  try again in a moment.";
        else if (code === "invalid_json") addState.error = "Couldn't parse the generated cards  -  try again.";
        else addState.error = "Something went wrong generating cards. Try again, or add a card manually.";
      }
      render();
      return;
    }

    var apiKey = getApiKey();
    if (!apiKey){
      addState.error = "Add your Anthropic API key below to enable automatic generation, or add a card manually.";
      render();
      return;
    }
    addState.status = "generating";
    render();
    try {
      var raw = await callAnthropicDirect(apiKey, prompt);
      var parsed = extractJson(raw);
      if (!applyGeneratedCards(parsed)) throw new Error("No cards found in the response");
      addState.status = "idle";
    } catch(e){
      addState.status = "idle";
      if (e && e.status === 401) addState.error = "That API key was rejected. Double-check it and save again.";
      else if (e && e.status === 429) addState.error = "Rate limited by the API  -  try again in a moment.";
      else addState.error = "Couldn't generate cards (" + (e && e.message ? e.message : "request failed") + "). If you're using the claude.ai link, this needs the page to be self-hosted instead  -  see the note below.";
    }
    render();
  }

  async function saveGeneratedDeck(){
    if (!addState.generated) return;
    await Store.addDeck(addState.title || addState.generated.title, "Generated from your notes", addState.generated.cards);
    addState = { text:"", fileName:"", title:"", status:"idle", error:"", generated:null };
    await refresh();
    state.tab = "home";
    render();
  }

  // ---------- nav ----------
  document.querySelectorAll(".tab-btn").forEach(function(btn){
    btn.onclick = function(){
      state.tab = btn.dataset.tab;
      if (state.tab !== "review"){ /* keep queue */ }
      render();
    };
  });

  // ---------- boot ----------
  (async function boot(){
    await Promise.all([Store.init(), initCapabilities()]);
    await refresh();
  })();
})();
</script>
